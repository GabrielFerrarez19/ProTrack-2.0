<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Teste jsPDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  </head>
  <body>
    <h1>Teste jsPDF</h1>
    <button onclick="testarPDF()">Gerar PDF de Teste</button>

    <script>
      function testarPDF() {
        try {
          console.log("Iniciando teste PDF...");

          // Criar PDF
          const { jsPDF } = window.jspdf;
          const pdf = new jsPDF();

          console.log("PDF criado:", pdf);

          // Adicionar texto
          pdf.setFontSize(16);
          pdf.text("Teste de PDF", 14, 20);

          // Adicionar tabela
          pdf.autoTable({
            head: [["Nome", "Idade", "Cidade"]],
            body: [
              ["João", "25", "São Paulo"],
              ["Maria", "30", "Rio de Janeiro"],
              ["Pedro", "28", "Belo Horizonte"],
            ],
            startY: 30,
            styles: {
              fontSize: 10,
              cellPadding: 3,
            },
            headStyles: {
              fillColor: [41, 128, 185],
              textColor: 255,
              fontStyle: "bold",
            },
          });

          // Salvar
          pdf.save("teste-pdf.pdf");

          console.log("PDF gerado com sucesso!");
          alert("PDF gerado com sucesso!");
        } catch (error) {
          console.error("Erro no teste PDF:", error);
          alert("Erro: " + error.message);
        }
      }
    </script>
  </body>
</html>
