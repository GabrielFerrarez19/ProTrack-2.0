services:
  db:
    image: postgres:16-alpine
    container_name: protrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-protrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pr0tr@ck2026}
      POSTGRES_DB: ${POSTGRES_DB:-protrack}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-protrack} -d $${POSTGRES_DB:-protrack}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./protrack-server
      dockerfile: Dockerfile
    container_name: protrack-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      API_PORT: ${API_PORT:-8080}
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-protrack}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pr0tr@ck2026}
      DB_NAME: ${POSTGRES_DB:-protrack}
      DB_SSLMODE: disable
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
